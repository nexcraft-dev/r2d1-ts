name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      resume_tag:
        description: Optional existing vX.Y.Z tag to recover. Leave empty for automatic selection.
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Keep this group shared with the previous publication workflow.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'nexcraft-dev/r2d1-ts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      version: ${{ steps.reserve.outputs.version }}
      tag: ${{ steps.reserve.outputs.tag }}
      sha: ${{ steps.reserve.outputs.sha }}
      artifact: ${{ steps.reserve.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Select a new version or recover an existing release
        id: plan
        env:
          RESUME_TAG: ${{ inputs.resume_tag }}
        run: node scripts/release.mjs plan
      - name: Prepare both version files on the selected main source
        run: node scripts/release.mjs stage
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
      - name: Inspect publish file list
        run: npm pack --dry-run --json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Preserve Node 22 compatibility checks
        run: npm test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Commit version files and atomically push main and its release tag
        id: reserve
        run: node scripts/release.mjs reserve
      - name: Pack the exact reserved commit
        env:
          RELEASE_VERSION: ${{ steps.reserve.outputs.version }}
        run: node scripts/prepare-release.mjs
      - name: Verify the exact release tarball
        run: npm run check:package -- release/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.reserve.outputs.artifact }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    # Checkout does not change GITHUB_REF. Environment policy still evaluates main.
    if: github.repository == 'nexcraft-dev/r2d1-ts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag, exact SHA, main ancestry and version files
        run: node scripts/release.mjs verify-source
      - name: Check npm OIDC support
        run: |
          node --input-type=module - <<'JS'
          import { execFileSync } from 'node:child_process';
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
            throw new Error('npm >=11.5.1 is required for trusted publishing');
          }
          console.log(`Using npm ${version}`);
          JS
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: release/
      - name: Verify artifact checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Verify the downloaded tarball
        run: npm run check:package -- release/*.tgz
      - name: Rebuild an archive from the checked-out tag commit
        run: node scripts/prepare-release.mjs "$RUNNER_TEMP/rebuilt-package"
      - name: Compare archive bytes with the checked-out tag commit
        run: cmp "release/nexcraft-dev-r2d1-$RELEASE_VERSION.tgz" "$RUNNER_TEMP/rebuilt-package/nexcraft-dev-r2d1-$RELEASE_VERSION.tgz"
      - name: Check whether the exact package is already published
        id: registry
        run: node scripts/release.mjs status
      - name: Publish the reserved version using OIDC
        if: steps.registry.outputs.publish == 'true'
        id: npm
        continue-on-error: true
        run: npm publish "./release/nexcraft-dev-r2d1-$RELEASE_VERSION.tgz" --ignore-scripts --access public --registry https://registry.npmjs.org/
      - name: Confirm the immutable npm artifact, including ambiguous publish responses
        if: always() && steps.registry.outcome == 'success'
        run: node scripts/release.mjs confirm
